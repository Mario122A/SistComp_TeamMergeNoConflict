<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Señales CDD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --accent-1: #3498db;
            --accent-2: #e74c3c;
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
            padding: 30px; 
            background: var(--card-bg); 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        h2 { margin-top: 0; font-weight: 600; color: #1a252f; }
        .badge {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            background: #eef2f5;
            font-size: 14px;
            font-weight: 600;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn { 
            padding: 12px 24px; 
            font-size: 15px; 
            font-weight: 600;
            cursor: pointer; 
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            color: white;
        }
        .btn-sig1 { background-color: var(--accent-1); box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3); }
        .btn-sig1:hover { background-color: #2980b9; transform: translateY(-2px); }
        .btn-sig2 { background-color: var(--accent-2); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); }
        .btn-sig2:hover { background-color: #c0392b; transform: translateY(-2px); }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
    </style>
    </script>
</head>
<body>
    <div class="container">
        <h2>Osciloscopio Digital - CDD</h2>
        <div class="badge" id="signal-indicator">Sensando: Señal 1 (1 Hz)</div>
        
        <div class="controls">
            <button class="btn btn-sig1" onclick="changeSignal(1)">Capturar Señal 1</button>
            <button class="btn btn-sig2" onclick="changeSignal(2)">Capturar Señal 2</button>
        </div>

        <div class="chart-container">
            <canvas id="signalChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('signalChart').getContext('2d');
        
        let signalChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [{
                    label: 'Amplitud Lógica (3.3V)',
                    data: [], 
                    borderColor: '#3498db',
                    backgroundColor: 'rgba(52, 152, 219, 0.1)',
                    borderWidth: 2,
                    stepped: true, 
                    fill: true,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: { intersect: false },
                plugins: { legend: { display: false } },
                scales: {
                    x: { 
                        title: { display: true, text: 'Tiempo (ms)' },
                        grid: { display: false }
                    },
                    y: { 
                        title: { display: true, text: 'Tensión (Voltios)', font: { weight: 'bold' } },
                        min: -0.5,
                        max: 4.0,
                        ticks: { stepSize: 1 }
                    }
                }
            }
        });

        function changeSignal(signalId) {
            fetch(`/api/set_signal/${signalId}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        const freq = signalId === 1 ? "1 Hz" : "2 Hz";
                        document.getElementById('signal-indicator').innerText = `Sensando: Señal ${signalId} (${freq})`;
                        
                        signalChart.data.labels = [];
                        signalChart.data.datasets[0].data = [];
                        
                        if (signalId === 1) {
                            signalChart.data.datasets[0].borderColor = '#3498db';
                            signalChart.data.datasets[0].backgroundColor = 'rgba(52, 152, 219, 0.1)';
                        } else {
                            signalChart.data.datasets[0].borderColor = '#e74c3c';
                            signalChart.data.datasets[0].backgroundColor = 'rgba(231, 76, 60, 0.1)';
                        }
                        signalChart.update();
                    }
                });
        }

        function fetchSignalData() {
            fetch('/api/read_signal')
                .then(response => response.json())
                .then(data => {
                    if (signalChart.data.labels.length > 40) {
                        signalChart.data.labels.shift();
                        signalChart.data.datasets[0].data.shift();
                    }
                    
                    signalChart.data.labels.push(data.timestamp);
                    signalChart.data.datasets[0].data.push(data.value);
                    signalChart.update();
                })
                .catch(err => console.error("Error fetching data:", err));
        }

        setInterval(fetchSignalData, 250);
    </script>
</body>
</html>
